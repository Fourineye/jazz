[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jazz"
dynamic = ["version"]
description = "A pygame wrapper that provides tools to quickly build games."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Paul Smith", email = "paulsmith8812@gmail.com" }
]
urls = { Homepage = "https://github.com/Fourineye/jazz" }
dependencies = [
    "pygame-ce",
]

[tool.hatch.version]
path = "jazz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jazz"]

[tool.pyrefly]
extra-paths = ["./examples/showcase"]

[dependency-groups]
dev = [
    # Docs tooling only; Sphinx 9.1 needs Python 3.12+
    "myst-parser>=5.1.0; python_version >= '3.12'",
    "sphinx>=9.1.0; python_version >= '3.12'",
    "sphinx-rtd-theme>=3.1.0; python_version >= '3.12'",
]
